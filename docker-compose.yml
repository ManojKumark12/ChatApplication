services:

  postgres:
    image: postgres:17
    container_name: postgres-db

    environment:
      POSTGRES_DB: chat_application
      POSTGRES_USER: manoj
      POSTGRES_PASSWORD: manoj123

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data


  backend:
    build: ./backend

    container_name: django-backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.docker.env

    depends_on:
      - postgres


  frontend:
    build: ./frontend

    ports:
      - "5173:5173"

    env_file:
      - ./frontend/.env

    depends_on:
      - backend


volumes:
  postgres-data:
